name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install age + shellcheck
        run: sudo apt-get update && sudo apt-get install -y age shellcheck

      - name: Lint shell scripts
        run: |
          shellcheck bin/claude-secrets
          shellcheck install.sh
          shellcheck test/run-tests.sh

      - name: Run test suite
        run: sh test/run-tests.sh
