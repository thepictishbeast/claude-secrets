[package]
name = "claude-secrets-hygiene"
version = "0.1.0"
edition = "2021"
description = "Find credentials that are reused or have not been rotated, without ever storing or printing one."
license = "MIT"
publish = false

# Three small, audited crates and nothing else. A tool that reads every
# credential on a machine should be reviewable in an afternoon.
[dependencies]
hmac = "0.13"
sha2 = "0.11"
zeroize = "1.8"

[[bin]]
name = "claude-secrets-hygiene"
path = "src/main.rs"
